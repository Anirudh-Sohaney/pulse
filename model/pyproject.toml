[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arkansas-pharma-signal"
version = "0.1.0"
description = "Arkansas pharmaceutical demand and shortage-risk forecasting from local real data"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
]

[project.optional-dependencies]
deep = [
    "torch>=2.13",
]
dev = [
    "pytest",
    "scikit-learn",
]

[tool.setuptools.packages.find]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
