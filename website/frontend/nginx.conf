server {
    listen 80;
    server_name _;
    # The public host proxy reaches this container through a loopback-only port.
    # Recover its sanitized client IP before forwarding requests to the API.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    root /usr/share/nginx/html;
    index index.html;
    # API requests are small JSON calls; private CSVs stay in the browser.
    client_max_body_size 256k;
    include /etc/nginx/security-headers.inc;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-doc-assets/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /pyodide/ {
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /browser_forecast.py {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
