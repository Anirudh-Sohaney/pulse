services:
  data-permissions:
    build: .
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/app/data"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data:/app/data

  backend:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    command: ["sh", "-c", "python -m scripts.import_signal_catalog && python -m scripts.audit_signal_store && python -m backend.main"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      PULSE_REVISION: ${PULSE_REVISION:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-false}
      DATA_PATH: /app/data
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3141","http://localhost:5173"]}'
      TRUSTED_PROXY_IPS: '${TRUSTED_PROXY_IPS:-[]}'
      TRUSTED_PROXY_HOSTNAMES: '${TRUSTED_PROXY_HOSTNAMES:-["frontend"]}'
    volumes:
      - ./data:/app/data
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      DATA_PATH: /app/data
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3141","http://localhost:5173"]}'
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      CMS_PARTD_SOURCE_PATH: /source/arkansas_partd_geography_drug_by_year.csv.gz
      CMS_PARTD_SOURCE_MANIFEST_PATH: /source/source_manifest.json
    volumes:
      - ./data:/app/data
      - ../data/targeted_additions/cms_partd_geography_drug/data/arkansas_partd_geography_drug_by_year.csv.gz:/source/arkansas_partd_geography_drug_by_year.csv.gz:ro
      - ../data/targeted_additions/cms_partd_geography_drug/source_manifest.json:/source/source_manifest.json:ro
    depends_on:
      data-permissions:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.operational_status", "worker"]
      interval: 5m
      timeout: 30s
      start_period: 2m
      retries: 2

  backup:
    build: .
    command: ["python", "-m", "backend.backup_worker"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      DATA_PATH: /app/data
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3141","http://localhost:5173"]}'
      CMS_PARTD_SOURCE_PATH: /source/arkansas_partd_geography_drug_by_year.csv.gz
      CMS_PARTD_SOURCE_MANIFEST_PATH: /source/source_manifest.json
    volumes:
      - ./data:/app/data
      - ../data/targeted_additions/cms_partd_geography_drug/data/arkansas_partd_geography_drug_by_year.csv.gz:/source/arkansas_partd_geography_drug_by_year.csv.gz:ro
      - ../data/targeted_additions/cms_partd_geography_drug/source_manifest.json:/source/source_manifest.json:ro
    depends_on:
      data-permissions:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.operational_status", "backup"]
      interval: 15m
      timeout: 2m
      start_period: 5m
      retries: 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /var/run:rw,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:3141:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
