# This file is included in Nginx's http context through sites-enabled.
limit_req_zone $binary_remote_addr zone=pulse_site:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pulse_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pulse_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=pulse_conn:10m;
map $status $pulse_retry_after { default ""; 429 2; }

server {
    listen 80;
    listen [::]:80;
    server_name pulseintelligence.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/pulse-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pulseintelligence.tech;
    ssl_certificate /etc/letsencrypt/live/pulseintelligence.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulseintelligence.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PulseSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 256k;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pulse_conn 30;
    limit_req zone=pulse_site burst=100 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Retry-After $pulse_retry_after always;

    location /api/auth/ {
        limit_req zone=pulse_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3141;
        include /etc/nginx/pulse-proxy-headers.conf;
    }

    location /api/ {
        limit_req zone=pulse_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3141;
        include /etc/nginx/pulse-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3141;
        include /etc/nginx/pulse-proxy-headers.conf;
    }
}
